# Testing credentials only — replace JWT_SECRET with a strong random value before real use.
# Apply manually before ArgoCD sync: kubectl apply -f k8s/backend-secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: demo-app
type: Opaque
stringData:
  PORT: "5000"
  ADMIN_EMAIL: "admin@localhost.com"
  ADMIN_PASSWORD: "Admin@123"
  JWT_SECRET: "super_secret_testing_key_change_in_prod"
  JWT_EXPIRES_IN: "2h"
